  <main id="main">
    <section id="chat-section" class="chat-container">
      <h1 class="text-center">Jen's Fanbot</h1>
      <p class="text-center">Ask about Jen and her amazing qualities! Start chatting to hear why I'm swooning over her.</p>
      <div class="chat-display" id="chatDisplay">
        <!-- Chat messages will appear here -->
      </div>
      <div class="chat-input">
        <textarea id="userInput" rows="2" placeholder="Type your message here..."></textarea>
        <button class="submit-btn" id="sendButton">Submit</button>
        <button class="clear-btn" id="clearButton">Clear</button>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    $(document).ready(function() {
      const BACKEND_URL = "https://a6lz1quw6h.execute-api.us-east-1.amazonaws.com/prod/chat";

      function escapeHtml(text) {
        var map = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
      }

      function sendMessage() {
        var userInput = $('#userInput').val().trim();
        if (!userInput) {
          alert('Please enter a question or comment.');
          return;
        }

        $('#chatDisplay').append('<p class="user-message"><strong>You:</strong> ' + escapeHtml(userInput) + '</p>');

        $.ajax({
          url: BACKEND_URL,
          type: "POST",
          contentType: "application/json",
          crossDomain: true,
          data: JSON.stringify({ query: userInput }),
          success: function(response) {
            try {
              var jsonResponse = typeof response === "string" ? JSON.parse(response) : response;
              if (jsonResponse.response) {
                $('#chatDisplay').append('<p class="bot-message"><strong>Fanbot:</strong> ' + escapeHtml(jsonResponse.response) + '</p>');
              } else {
                $('#chatDisplay').append('<p class="bot-message"><strong>Fanbot:</strong> No valid response received.</p>');
              }
            } catch (e) {
              console.error("Parsing Error:", e);
              $('#chatDisplay').append('<p class="bot-message"><strong>Fanbot:</strong> Error processing response.</p>');
            }
          },
          error: function(xhr, status, error) {
            console.error("API Error:", xhr.responseText || error);
            $('#chatDisplay').append('<p class="bot-message"><strong>Fanbot:</strong> Error processing request.</p>');
          }
        });
      }

      $('#sendButton').click(sendMessage);
      $('#clearButton').click(function() { $('#chatDisplay').empty(); });

      $('#userInput').keypress(function(event) {
        if (event.which === 13 && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });
    });
  </script>
