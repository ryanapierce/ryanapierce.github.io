<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      * { box-sizing: border-box; }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #000;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #canvascontainer {
        width: 100vw;
        height: 100vh;
        position: relative;
      }

      canvas {
        position: absolute;
        width: 100vw;
        height: 100vh;
        top: 0;
        left: 0;
        -webkit-transform: translate3d(0,0,0);
        -moz-transform: translate3d(0,0,0);
        transform: translate3d(0,0,0);
        display: block;
      }

      #canvascontainer > div {
        color: white;
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        font-size: 2em;
        pointer-events: none;
      }

      .flicker-quote {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 90vw;
  max-width: 800px;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 2em;
  text-align: center;
  opacity: 0.6;
  z-index: 10;
  pointer-events: none;
  background: transparent;
  animation: flicker 8s infinite alternate;
  font-family: 'Georgia', serif;
  letter-spacing: 0.02em;
  line-height: 1.3;
}

@keyframes flicker {
  0%   { opacity: 0.6; text-shadow: 0 0 2px #fff, 0 0 10px #fff; }
  10%  { opacity: 0.7; text-shadow: 0 0 4px #fff, 0 0 20px #f8f8ff; }
  20%  { opacity: 0.5; text-shadow: 0 0 2px #fff, 0 0 10px #fff; }
  30%  { opacity: 0.8; text-shadow: 0 0 6px #fff, 0 0 30px #f8f8ff; }
  40%  { opacity: 0.6; text-shadow: 0 0 2px #fff, 0 0 10px #fff; }
  50%  { opacity: 0.9; text-shadow: 0 0 8px #fff, 0 0 40px #fff; }
  60%  { opacity: 0.5; text-shadow: 0 0 2px #fff, 0 0 10px #fff; }
  70%  { opacity: 0.7; text-shadow: 0 0 4px #fff, 0 0 20px #f8f8ff; }
  80%  { opacity: 0.6; text-shadow: 0 0 2px #fff, 0 0 10px #fff; }
  90%  { opacity: 0.8; text-shadow: 0 0 6px #fff, 0 0 30px #f8f8ff; }
  100% { opacity: 0.6; text-shadow: 0 0 2px #fff, 0 0 10px #fff; }
}
    </style>
</head>
<body>
<div id="canvascontainer">
  <canvas id="buffer"></canvas>
  <canvas id="canvas"></canvas>
  <div class="flicker-quote">“If you love someone, let them go. If they come back, they're yours. If they don't, they were never yours to begin with"</div>
</div>
<script>
var bg = bg || {};

//Get random int between two numbers
function randomRange(from, to, seed){ return Math.floor((seed?seed:Math.random())*(to-from+1)+from); }

//Fire
(function(b){
  var cntr   = document.getElementById("canvascontainer"),
      canvas = [document.getElementById("canvas"), document.getElementById("buffer")],
      ctxs   = [canvas[0].getContext("2d"), canvas[1].getContext("2d")],
      C      = 0, 
      angle  = 0,
      A      = [],
      int;

  function resize() {
    cntr.style.width = window.innerWidth + "px";
    cntr.style.height = window.innerHeight + "px";
    canvas[0].width = window.innerWidth;
    canvas[0].height = window.innerHeight;
    canvas[1].width = window.innerWidth;
    canvas[1].height = window.innerHeight;
  }

  window.addEventListener('resize', function() {
    resize();
  });

  function ash(o) {
    var i,
        j,
        m = Math.random(),
        p = randomRange(4, 8, m),
        W = canvas[0].width,
        H = canvas[0].height;

    if(o && o.x) this.x = o.x;
    else this.x = m*W;
    if(o && o.y) this.y = o.y;
    else this.y = m*H;
    if(o && o.a) this.a = o.a;
    else this.a = m*(p-4)+1;
    this.r = randomRange(233, 255, m);
    this.g = randomRange(181, 192, m);
    this.b = randomRange(72, 88, m);
    
    if(o && o.dp) this.dp = o.dp;
    else {
      this.dp = [{x:0,y:0}];
      for(i = 0; i < p; i++) {
        j = (i == 0 || p/2 > i ? 1 : -1);
        this.dp.push({x:this.dp[i].x+(randomRange(5, 30)*j), y:this.dp[i].y+(randomRange(5, 30)*j)});
      }
    }
  }
  
  function draw() {
    var grad, i, j, p, ctx,
        W = canvas[0].width,
        H = canvas[0].height;
    if(C == 0) {
      //Show the canvas
      canvas[0].style.visibility = "visible";
      canvas[1].style.visibility = "hidden";
      C = 1;
    } else {
      //Show the buffer
      canvas[1].style.visibility = "visible";
      canvas[0].style.visibility = "hidden";
      C = 0;
    }
    
    ctx = ctxs[C];
    ctx.clearRect(0, 0, W, H);

    for(i = 0; i < A.length; i++) {
      p    = A[i];
      grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.a);
      grad.addColorStop(0, "rgba("+p.r+", "+p.g+", "+p.b+", 1)");
      grad.addColorStop(0.9, "rgba("+p.r+", "+p.g+", "+p.b+", "+randomRange(1,10)/10+")");
      grad.addColorStop(1, "rgba("+p.r+", "+p.g+", "+p.b+", 0)");
      
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      for(j = 1; j < p.dp.length; j++) ctx.lineTo(p.x+p.dp[j].x, p.y+p.dp[j].y);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.globalAlpha = 0.7;
      ctx.fill();
    }

    update(); 
  }
  
  function update() {
    var i, p,
        W = canvas[0].width,
        H = canvas[0].height;
    angle += 0.01;
    
    for(i = 0; i < A.length; i++) {
      p = A[i];

      p.y += Math.cos(angle+A.length) + 1 + p.a/2;
      p.x += Math.sin(angle) * 2;
      
      if(p.x > W+5 || p.x < -5 || p.y > H) {
        if(i % 3 > 0) A[i] = new ash({y: -10, a: p.a, d: p.d, dp: p.dp});
        else {
          //Enter from the left
          if(Math.sin(angle) > 0) A[i] = new ash({x: -5, a: p.a, d: p.d, dp: p.dp});
          //Enter from the right
          else A[i] = new ash({x: W+5, a: p.a, d: p.d, dp: p.dp});
        }
      }
    }
  }
  
  //Run
  resize();
  for(var i = 0; i < 50; i++) A.push(new ash());
  setInterval(draw, 33);
})(bg);
</script>
</body>
</html>
